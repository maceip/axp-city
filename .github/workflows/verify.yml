name: Verify Phaser city
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # sprites.test.ts shells out to Pillow; a missing PIL is a failed unit
      # gate, not a skipped tileset proof.
      - run: python -m pip install -r test/requirements.txt -r e2e/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:operations

  # Standard pytest-playwright browser selection, following Streamlit:
  # https://github.com/streamlit/streamlit/blob/a807ca5f8274de0eb708729cb40266f6321b82cc/.github/workflows/playwright.yml
  # Functional checks run here. Frame-time benchmarks are an explicit local command.
  browser-local:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r e2e/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Test ${{ matrix.engine }}
        run: python -m pytest e2e/test_core_city.py --browser ${{ matrix.engine }} --screenshot only-on-failure -v -o faulthandler_timeout=120
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failure-${{ matrix.engine }}
          path: |
            test-results/
            e2e/screenshots/
          retention-days: 7
