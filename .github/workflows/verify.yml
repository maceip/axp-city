name: Verify Phaser city
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # sprites.test.ts shells out to Pillow; a missing PIL is a failed unit
      # gate, not a skipped tileset proof.
      - run: pip install pillow
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # Software-rendered correctness only. Never hosted Playwright proof.
  browser-local:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Chromium runs the whole suite including the 1,000-lot performance
        # scenarios; Firefox and WebKit run the visual, support and export
        # suites so the support matrix in docs/SUPPORT.md stays verified.
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: pip install -r e2e/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Browser suite (local SwiftShader Chromium — not hosted proof)
        if: matrix.engine == 'chromium'
        run: python -m pytest e2e -v
        env:
          CITY_LOCAL_BROWSER: "1"
          CITY_SOFTWARE_GL: "1"
          GITHUB_TOKEN: ${{ github.token }}
      - name: Browser suite (local ${{ matrix.engine }} — not hosted proof)
        if: matrix.engine != 'chromium'
        run: python -m pytest e2e/test_city_visual.py e2e/test_support.py e2e/test_exports.py e2e/test_live_local.py -v
        env:
          CITY_LOCAL_BROWSER: "1"
          CITY_BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phaser-browser-local-${{ matrix.engine }}
          path: e2e/screenshots/

  # Fail closed: missing PLAYWRIGHT_SERVICE_* secrets is a failed hosted
  # proof, not a green skip that looks like the workspace ran.
  hosted-playwright:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Require hosted Playwright credentials
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
          PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ secrets.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
        run: |
          if [ -z "$PLAYWRIGHT_SERVICE_URL" ] || [ -z "$PLAYWRIGHT_SERVICE_ACCESS_TOKEN" ]; then
            echo "::error::hosted Playwright proof blocked: repo secrets PLAYWRIGHT_SERVICE_URL and PLAYWRIGHT_SERVICE_ACCESS_TOKEN must both be set. Local SwiftShader / browser-local is not hosted proof."
            exit 1
          fi
          echo "Hosted Playwright credentials present; connecting to Azure Playwright Chromium."
      - run: npm ci
      - run: npm run build
      - run: pip install -r e2e/requirements.txt
      - name: Browser suite (hosted Azure Playwright Chromium)
        run: python -m pytest e2e -v
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
          PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ secrets.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
          PLAYWRIGHT_SERVICE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phaser-hosted-playwright
          path: e2e/screenshots/
